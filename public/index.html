<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi Web</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div id="app">
    <button id="menu-toggle" aria-label="Toggle menu" onclick="toggleSidebar()">☰</button>
    <div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;max-height:120px;overflow:auto;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:11px;padding:6px;z-index:999;display:none;"></div>
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>pi</h1>
        <button id="new-session-btn" title="New session">+</button>
      </div>
      <div class="sidebar-section">
        <h2>Active</h2>
        <ul id="instance-list"></ul>
      </div>
      <div class="sidebar-section">
        <h2>History</h2>
        <ul id="history-list"></ul>
      </div>
      <div class="sidebar-section">
        <h2>New in folder</h2>
        <div class="fs-breadcrumb" id="fs-breadcrumb"></div>
        <ul id="fs-list" class="fs-list"></ul>
        <div class="new-folder-row">
          <input id="new-cwd-input" type="text" placeholder="/path/to/project" value="" />
          <button id="new-cwd-btn">Go</button>
        </div>
      </div>
      <div class="sidebar-footer">
        <span id="status-text">Ready</span>
      </div>
    </aside>
    <div id="sidebar-overlay"></div>
    <main id="main">
      <div id="tabs">
        <div class="pi-tab active" id="pi-tab" data-tab="pi">pi</div>
      </div>
      <div id="terminals"></div>
    </main>
  </div>

  <div id="login-overlay">
    <div class="login-box">
      <h2>pi Web</h2>
      <input id="token-input" type="password" placeholder="Enter token" />
      <button id="login-btn">Connect</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
